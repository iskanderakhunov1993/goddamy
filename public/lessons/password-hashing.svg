<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="340" fill="#eef1fb"/>
  <text x="60" y="44" fill="#4b3aeb" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">РЕГИСТРАЦИЯ · ЧТО ПОПАДАЕТ В БАЗУ</text>

  <rect x="60" y="64" width="150" height="56" rx="12" fill="#ffffff" stroke="#dfe1ee" stroke-width="2"/>
  <text x="135" y="98" fill="#141522" font-family="monospace" font-size="13" text-anchor="middle">пароль</text>
  <text x="228" y="98" fill="#4b3aeb" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">+</text>
  <rect x="246" y="64" width="150" height="56" rx="12" fill="#ffffff" stroke="#dfe1ee" stroke-width="2"/>
  <text x="321" y="98" fill="#141522" font-family="monospace" font-size="13" text-anchor="middle">случайная соль</text>

  <path d="M408 92 L 452 92" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M444 86 l8 6 l-8 6" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="460" y="64" width="150" height="56" rx="12" fill="#0a0a23"/>
  <text x="535" y="88" fill="#ffd300" font-family="monospace" font-size="12" text-anchor="middle">медленный хеш</text>
  <text x="535" y="106" fill="#c7c9d6" font-family="monospace" font-size="11" text-anchor="middle">много итераций</text>

  <path d="M622 92 L 666 92" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M658 86 l8 6 l-8 6" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="674" y="52" width="86" height="80" rx="12" fill="#d3eee3" stroke="#a9dcc7" stroke-width="2"/>
  <text x="717" y="82" fill="#1a7554" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">в базе:</text>
  <text x="717" y="100" fill="#1a7554" font-family="monospace" font-size="11" text-anchor="middle">соль</text>
  <text x="717" y="116" fill="#1a7554" font-family="monospace" font-size="11" text-anchor="middle">+ хеш</text>

  <line x1="60" y1="168" x2="740" y2="168" stroke="#dfe1ee" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="60" y="206" fill="#4b3aeb" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">ВХОД · КАК СЕРВЕР ПРОВЕРЯЕТ ПАРОЛЬ</text>

  <rect x="60" y="226" width="200" height="56" rx="12" fill="#ffffff" stroke="#dfe1ee" stroke-width="2"/>
  <text x="160" y="250" fill="#141522" font-family="monospace" font-size="12" text-anchor="middle">введённый пароль</text>
  <text x="160" y="268" fill="#5b6072" font-family="monospace" font-size="11" text-anchor="middle">+ соль из базы</text>
  <path d="M272 254 L 316 254" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M308 248 l8 6 l-8 6" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="324" y="226" width="150" height="56" rx="12" fill="#0a0a23"/>
  <text x="399" y="259" fill="#ffd300" font-family="monospace" font-size="12" text-anchor="middle">тот же хеш</text>
  <path d="M486 254 L 530 254" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M522 248 l8 6 l-8 6" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="538" y="226" width="222" height="56" rx="12" fill="#ffffff" stroke="#dfe1ee" stroke-width="2"/>
  <text x="649" y="250" fill="#141522" font-family="sans-serif" font-size="12" text-anchor="middle">совпал с сохранённым?</text>
  <text x="649" y="268" fill="#1a7554" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">да — вход разрешён</text>

  <text x="60" y="320" fill="#5b6072" font-family="sans-serif" font-size="12">Сам пароль не хранится нигде, поэтому утечка базы не раскрывает его сразу.</text>
</svg>
