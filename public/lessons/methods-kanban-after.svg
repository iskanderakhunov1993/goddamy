<svg xmlns="http://www.w3.org/2000/svg" width="800" height="478" viewBox="0 0 800 478" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Канбан-доска с лимитом: три карточки в работе при лимите четыре, одна заблокирована с причиной, пять задач готово">
<rect width="800" height="478" fill="#ffffff"/>
<text x="10" y="30" font-size="16" font-weight="700" fill="#12141d">Пятница через неделю, доска «после»</text>
<text x="790" y="30" font-size="12" fill="#5b6072" text-anchor="end">Р1–Р4: разработчики</text>
<rect x="10" y="44" width="186" height="372" rx="12" fill="#ffffff" stroke="#dfe1ee"/><text x="20" y="68" font-size="13" font-weight="700" fill="#12141d">Очередь</text><rect x="166" y="53" width="22" height="20" rx="10" fill="#f5f6fb"/><text x="177.0" y="67.5" font-size="12" font-weight="700" fill="#5b6072" text-anchor="middle">3</text>
<rect x="18" y="84" width="170" height="36" rx="9" fill="#f5f6fb" stroke="#dfe1ee"/><text x="27" y="105" font-size="12" font-weight="700" fill="#12141d">Чаевые курьеру</text>
<rect x="18" y="128" width="170" height="36" rx="9" fill="#f5f6fb" stroke="#dfe1ee"/><text x="27" y="149" font-size="12" font-weight="700" fill="#12141d">Отзывы о заказе</text>
<rect x="18" y="172" width="170" height="36" rx="9" fill="#f5f6fb" stroke="#dfe1ee"/><text x="27" y="193" font-size="12" font-weight="700" fill="#12141d">Избранные блюда</text>
<rect x="208" y="44" width="186" height="372" rx="12" fill="#ffffff" stroke="#dfe1ee"/><text x="218" y="68" font-size="13" font-weight="700" fill="#12141d">В работе</text><rect x="324" y="53" width="62" height="20" rx="10" fill="#e9e6ff"/><text x="355.0" y="67.5" font-size="12" font-weight="700" fill="#4b3aeb" text-anchor="middle">3 из 4</text>
<rect x="216" y="84" width="170" height="82" rx="9" fill="#fff3d6" stroke="#b26a00"/><text x="225" y="105" font-size="12" font-weight="700" fill="#12141d">Оплата картой</text><rect x="224" y="118" width="30" height="20" rx="10" fill="#e9e6ff"/><text x="239.0" y="132.5" font-size="12" font-weight="700" fill="#4b3aeb" text-anchor="middle">Р1</text><rect x="260" y="118" width="104" height="20" rx="10" fill="#ffffff"/><text x="312.0" y="132.5" font-size="12" font-weight="700" fill="#b26a00" text-anchor="middle">заблокировано</text><text x="225" y="156" font-size="12" fill="#b26a00">Ждём доступ от банка</text>
<rect x="216" y="174" width="170" height="56" rx="9" fill="#f5f6fb" stroke="#dfe1ee"/><text x="225" y="195" font-size="12" font-weight="700" fill="#12141d">Повтор заказа</text><rect x="224" y="202" width="30" height="20" rx="10" fill="#e9e6ff"/><text x="239.0" y="216.5" font-size="12" font-weight="700" fill="#4b3aeb" text-anchor="middle">Р2</text>
<rect x="216" y="238" width="170" height="56" rx="9" fill="#f5f6fb" stroke="#dfe1ee"/><text x="225" y="259" font-size="12" font-weight="700" fill="#12141d">Фильтр по кухне</text><rect x="224" y="266" width="30" height="20" rx="10" fill="#e9e6ff"/><text x="239.0" y="280.5" font-size="12" font-weight="700" fill="#4b3aeb" text-anchor="middle">Р4</text>
<rect x="216" y="302" width="170" height="44" rx="9" fill="#ffffff" stroke="#4b3aeb" stroke-dasharray="5 4"/>
<text x="301" y="329" font-size="12" fill="#4b3aeb" text-anchor="middle">свободное место</text>
<rect x="406" y="44" width="186" height="372" rx="12" fill="#ffffff" stroke="#dfe1ee"/><text x="416" y="68" font-size="13" font-weight="700" fill="#12141d">Проверка</text><rect x="562" y="53" width="22" height="20" rx="10" fill="#f5f6fb"/><text x="573.0" y="67.5" font-size="12" font-weight="700" fill="#5b6072" text-anchor="middle">1</text>
<rect x="414" y="84" width="170" height="56" rx="9" fill="#f5f6fb" stroke="#dfe1ee"/><text x="423" y="105" font-size="12" font-weight="700" fill="#12141d">Пуш о статусе заказа</text><rect x="422" y="112" width="30" height="20" rx="10" fill="#e9e6ff"/><text x="437.0" y="126.5" font-size="12" font-weight="700" fill="#4b3aeb" text-anchor="middle">Р4</text>
<rect x="604" y="44" width="186" height="372" rx="12" fill="#ffffff" stroke="#dfe1ee"/><text x="614" y="68" font-size="13" font-weight="700" fill="#12141d">Готово</text><rect x="760" y="53" width="22" height="20" rx="10" fill="#e3f4ea"/><text x="771.0" y="67.5" font-size="12" font-weight="700" fill="#1b7a4b" text-anchor="middle">5</text>
<rect x="612" y="84" width="170" height="56" rx="9" fill="#f5f6fb" stroke="#dfe1ee"/><text x="621" y="105" font-size="12" font-weight="700" fill="#12141d">Двойное списание</text><rect x="620" y="112" width="30" height="20" rx="10" fill="#e9e6ff"/><text x="635.0" y="126.5" font-size="12" font-weight="700" fill="#4b3aeb" text-anchor="middle">Р1</text><rect x="656" y="112" width="38" height="20" rx="10" fill="#fdecea"/><text x="675.0" y="126.5" font-size="12" font-weight="700" fill="#b3261e" text-anchor="middle">баг</text><rect x="700" y="112" width="58" height="20" rx="10" fill="#e3f4ea"/><text x="729.0" y="126.5" font-size="12" font-weight="700" fill="#1b7a4b" text-anchor="middle">готово</text>
<rect x="612" y="148" width="170" height="56" rx="9" fill="#f5f6fb" stroke="#dfe1ee"/><text x="621" y="169" font-size="12" font-weight="700" fill="#12141d">Адрес без квартиры</text><rect x="620" y="176" width="30" height="20" rx="10" fill="#e9e6ff"/><text x="635.0" y="190.5" font-size="12" font-weight="700" fill="#4b3aeb" text-anchor="middle">Р3</text><rect x="656" y="176" width="38" height="20" rx="10" fill="#fdecea"/><text x="675.0" y="190.5" font-size="12" font-weight="700" fill="#b3261e" text-anchor="middle">баг</text><rect x="700" y="176" width="58" height="20" rx="10" fill="#e3f4ea"/><text x="729.0" y="190.5" font-size="12" font-weight="700" fill="#1b7a4b" text-anchor="middle">готово</text>
<rect x="612" y="212" width="170" height="56" rx="9" fill="#f5f6fb" stroke="#dfe1ee"/><text x="621" y="233" font-size="12" font-weight="700" fill="#12141d">Трекинг курьера</text><rect x="620" y="240" width="30" height="20" rx="10" fill="#e9e6ff"/><text x="635.0" y="254.5" font-size="12" font-weight="700" fill="#4b3aeb" text-anchor="middle">Р2</text><rect x="656" y="240" width="58" height="20" rx="10" fill="#e3f4ea"/><text x="685.0" y="254.5" font-size="12" font-weight="700" fill="#1b7a4b" text-anchor="middle">готово</text>
<rect x="612" y="276" width="170" height="56" rx="9" fill="#f5f6fb" stroke="#dfe1ee"/><text x="621" y="297" font-size="12" font-weight="700" fill="#12141d">Промокоды</text><rect x="620" y="304" width="30" height="20" rx="10" fill="#e9e6ff"/><text x="635.0" y="318.5" font-size="12" font-weight="700" fill="#4b3aeb" text-anchor="middle">Р3</text><rect x="656" y="304" width="58" height="20" rx="10" fill="#e3f4ea"/><text x="685.0" y="318.5" font-size="12" font-weight="700" fill="#1b7a4b" text-anchor="middle">готово</text>
<rect x="612" y="340" width="170" height="56" rx="9" fill="#f5f6fb" stroke="#dfe1ee"/><text x="621" y="361" font-size="12" font-weight="700" fill="#12141d">История заказов</text><rect x="620" y="368" width="30" height="20" rx="10" fill="#e9e6ff"/><text x="635.0" y="382.5" font-size="12" font-weight="700" fill="#4b3aeb" text-anchor="middle">Р4</text><rect x="656" y="368" width="58" height="20" rx="10" fill="#e3f4ea"/><text x="685.0" y="382.5" font-size="12" font-weight="700" fill="#1b7a4b" text-anchor="middle">готово</text>
<rect x="10" y="428" width="780" height="38" rx="12" fill="#e3f4ea"/>
<text x="400" y="452" font-size="13" font-weight="700" fill="#1b7a4b" text-anchor="middle">За неделю закончено 5 задач. Блокер виден на доске вместе с причиной.</text>
</svg>
