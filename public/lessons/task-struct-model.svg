<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="360" fill="#eef1fb"/>

  <text x="60" y="50" fill="#4b3aeb" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">STRUCT TASK · ТРИ ПОЛЯ</text>

  <!-- struct card -->
  <rect x="60" y="76" width="330" height="230" rx="18" fill="#0a0a23"/>
  <text x="90" y="118" fill="#ffd300" font-family="monospace" font-size="14">type Task struct {</text>
  <text x="112" y="152" fill="#c7c9d6" font-family="monospace" font-size="14">ID    int</text>
  <text x="112" y="184" fill="#c7c9d6" font-family="monospace" font-size="14">Title string</text>
  <text x="112" y="216" fill="#c7c9d6" font-family="monospace" font-size="14">Done  bool</text>
  <text x="90" y="250" fill="#ffd300" font-family="monospace" font-size="14">}</text>

  <!-- arrows to explanation cards -->
  <path d="M400 152 L 452 152" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M444 146 l8 6 l-8 6" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="460" y="112" width="280" height="80" rx="14" fill="#ffffff" stroke="#dfe1ee" stroke-width="2"/>
  <text x="484" y="140" fill="#141522" font-family="monospace" font-size="13" font-weight="700">ID int</text>
  <text x="484" y="162" fill="#5b6072" font-family="sans-serif" font-size="12">max(существующие ID) + 1 —</text>
  <text x="484" y="180" fill="#5b6072" font-family="sans-serif" font-size="12">переживает удаление задач</text>

  <path d="M400 216 L 452 216" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M444 210 l8 6 l-8 6" stroke="#4b3aeb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="460" y="202" width="280" height="90" rx="14" fill="#ffffff" stroke="#dfe1ee" stroke-width="2"/>
  <text x="484" y="230" fill="#141522" font-family="monospace" font-size="13" font-weight="700">Done bool</text>
  <text x="484" y="252" fill="#5b6072" font-family="sans-serif" font-size="12">переключается командой done,</text>
  <text x="484" y="270" fill="#5b6072" font-family="sans-serif" font-size="12">выводится как [x] / [ ] в list</text>

  <text x="90" y="330" fill="#8f92aa" font-family="sans-serif" font-size="12">Заглавная буква у каждого поля — не стиль, а видимость: с маленькой буквы поле не попадёт в JSON</text>
</svg>
