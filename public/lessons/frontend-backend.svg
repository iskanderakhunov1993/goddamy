  <text x="476" y="108" fill="#ffd300" font-family="monospace" font-size="12">func createTask(w, r) {</text>
  <text x="492" y="134" fill="#c7c9d6" font-family="monospace" font-size="12">task := decode(r.Body)</text>
  <text x="492" y="158" fill="#c7c9d6" font-family="monospace" font-size="12">db.Save(task)</text>
  <text x="492" y="182" fill="#c7c9d6" font-family="monospace" font-size="12">respond(201, task)</text>
  <text x="476" y="206" fill="#ffd300" font-family="monospace" font-size="12">}</text>

