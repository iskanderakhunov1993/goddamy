<svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="380" fill="#eef1fb"/>

  <!-- risky path -->
  <text x="60" y="44" fill="#c0392b" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">НАПРЯМУЮ · ЕСТЬ ОКНО СБОЯ</text>
  <rect x="60" y="64" width="220" height="60" rx="12" fill="#ffffff" stroke="#dfe1ee" stroke-width="2"/>
  <text x="82" y="99" fill="#141522" font-family="monospace" font-size="13">WriteFile(tasks.json)</text>
  <path d="M280 94 L 330 94" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M322 88 l8 6 l-8 6" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="338" y="64" width="180" height="60" rx="12" fill="#fbe9e7" stroke="#e8b4ac" stroke-width="2"/>
  <text x="356" y="90" fill="#8b3e3e" font-family="sans-serif" font-size="12" font-weight="700">процесс упал</text>
  <text x="356" y="108" fill="#8b3e3e" font-family="sans-serif" font-size="12">на середине записи</text>
  <path d="M538 94 L 588 94" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M580 88 l8 6 l-8 6" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="596" y="64" width="150" height="60" rx="12" fill="#8b3e3e"/>
  <text x="616" y="99" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">файл повреждён</text>

  <line x1="60" y1="165" x2="740" y2="165" stroke="#dfe1ee" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- atomic path -->
  <text x="60" y="204" fill="#1a7554" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">TMP + RENAME · БЕЗ ОКНА СБОЯ</text>

  <rect x="60" y="224" width="180" height="60" rx="12" fill="#ffffff" stroke="#dfe1ee" stroke-width="2"/>
  <text x="80" y="259" fill="#141522" font-family="monospace" font-size="13">WriteFile(.tmp)</text>
  <path d="M240 254 L 288 254" stroke="#1a7554" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M280 248 l8 6 l-8 6" stroke="#1a7554" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="296" y="224" width="200" height="60" rx="12" fill="#d3eee3" stroke="#a9dcc7" stroke-width="2"/>
  <text x="316" y="250" fill="#1a7554" font-family="sans-serif" font-size="12" font-weight="700">если упал здесь —</text>
  <text x="316" y="268" fill="#1a7554" font-family="sans-serif" font-size="12">старый tasks.json цел</text>

  <path d="M496 254 L 544 254" stroke="#1a7554" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M536 248 l8 6 l-8 6" stroke="#1a7554" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="552" y="224" width="188" height="60" rx="12" fill="#0a0a23"/>
  <text x="572" y="250" fill="#ffd300" font-family="monospace" font-size="12">os.Rename(tmp,</text>
  <text x="572" y="268" fill="#ffd300" font-family="monospace" font-size="12">  tasks.json)</text>

  <text x="60" y="336" fill="#5b6072" font-family="sans-serif" font-size="12">Rename на одной файловой системе — атомарная операция ОС: она либо происходит целиком, либо не происходит вовсе.</text>
  <text x="60" y="356" fill="#5b6072" font-family="sans-serif" font-size="12">Промежуточного «наполовину переименованного» состояния не существует — в отличие от прямой записи.</text>
</svg>
