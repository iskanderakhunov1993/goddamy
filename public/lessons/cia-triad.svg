  <text x="400" y="214" fill="#141522" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">данные и системы</text>

  <text x="450" y="72" fill="#141522" font-family="sans-serif" font-size="14" font-weight="700">Конфиденциальность</text>
