<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Пять шагов спринта на курсе: задача, изучи, сделай, проверь и сдай, ретро">
  <rect width="800" height="320" fill="#ffffff"/>

  <text x="24" y="36" font-size="18" font-weight="700" fill="#12141d">Спринт на курсе: один проект, примерно неделя</text>

  <line x1="96" y1="84" x2="704" y2="84" stroke="#4b3aeb" stroke-width="2"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="96" cy="84" r="17" fill="#4b3aeb"/><text x="96" y="89" fill="#ffffff">1</text>
    <circle cx="248" cy="84" r="17" fill="#4b3aeb"/><text x="248" y="89" fill="#ffffff">2</text>
    <circle cx="400" cy="84" r="17" fill="#4b3aeb"/><text x="400" y="89" fill="#ffffff">3</text>
    <circle cx="552" cy="84" r="17" fill="#4b3aeb"/><text x="552" y="89" fill="#ffffff">4</text>
    <circle cx="704" cy="84" r="17" fill="#4b3aeb"/><text x="704" y="89" fill="#ffffff">5</text>
  </g>

  <g>
    <rect x="24" y="116" width="144" height="110" rx="12" fill="#f5f6fb" stroke="#dfe1ee"/>
    <text x="38" y="144" font-size="14" font-weight="700" fill="#12141d">Задача</text>
    <text x="38" y="170" font-size="12" fill="#5b6072">Тикет от тимлида:</text>
    <text x="38" y="188" font-size="12" fill="#5b6072">контекст, контракт,</text>
    <text x="38" y="206" font-size="12" fill="#5b6072">критерии приёмки</text>

    <rect x="176" y="116" width="144" height="110" rx="12" fill="#f5f6fb" stroke="#dfe1ee"/>
    <text x="190" y="144" font-size="14" font-weight="700" fill="#12141d">Изучи</text>
    <text x="190" y="170" font-size="12" fill="#5b6072">Документация,</text>
    <text x="190" y="188" font-size="12" fill="#5b6072">пример соседней</text>
    <text x="190" y="206" font-size="12" fill="#5b6072">команды, уроки</text>

    <rect x="328" y="116" width="144" height="110" rx="12" fill="#f5f6fb" stroke="#dfe1ee"/>
    <text x="342" y="144" font-size="14" font-weight="700" fill="#12141d">Сделай</text>
    <text x="342" y="170" font-size="12" fill="#5b6072">Код на своём</text>
    <text x="342" y="188" font-size="12" fill="#5b6072">компьютере,</text>
    <text x="342" y="206" font-size="12" fill="#5b6072">коммиты в GitHub</text>

    <rect x="480" y="116" width="144" height="110" rx="12" fill="#e9e6ff" stroke="#4b3aeb"/>
    <text x="494" y="144" font-size="14" font-weight="700" fill="#12141d">Проверь и сдай</text>
    <text x="494" y="170" font-size="12" fill="#5b6072">go run check.go,</text>
    <text x="494" y="188" font-size="12" fill="#5b6072">проверка на GitHub,</text>
    <text x="494" y="206" font-size="12" fill="#5b6072">ссылка на сайте</text>

    <rect x="632" y="116" width="144" height="110" rx="12" fill="#f5f6fb" stroke="#dfe1ee"/>
    <text x="646" y="144" font-size="14" font-weight="700" fill="#12141d">Ретро</text>
    <text x="646" y="170" font-size="12" fill="#5b6072">Что получилось,</text>
    <text x="646" y="188" font-size="12" fill="#5b6072">что мешало,</text>
    <text x="646" y="206" font-size="12" fill="#5b6072">что сделаю иначе</text>
  </g>

  <rect x="24" y="246" width="752" height="40" rx="12" fill="#f5f6fb" stroke="#dfe1ee"/>
  <text x="400" y="271" font-size="13" fill="#12141d" text-anchor="middle">Темп твой: расписания и дедлайнов нет</text>
</svg>
