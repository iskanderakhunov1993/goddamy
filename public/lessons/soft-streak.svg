    <rect x="284" y="70" width="46" height="46" rx="10" fill="#4b3aeb"/>
    <rect x="340" y="70" width="46" height="46" rx="10" fill="#4b3aeb"/>
    <rect x="396" y="70" width="46" height="46" rx="10" fill="#ffffff" stroke="#dfe1ee" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="452" y="70" width="46" height="46" rx="10" fill="#ffffff" stroke="#dfe1ee" stroke-width="2" stroke-dasharray="4 4"/>
