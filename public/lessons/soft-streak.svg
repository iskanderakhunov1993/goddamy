  <text x="228" y="140" fill="#8f92aa" font-family="sans-serif" font-size="11">пропуск</text>
  <text x="500" y="140" fill="#141522" font-family="sans-serif" font-size="11" font-weight="700">серия 4 дня</text>

  <rect x="60" y="175" width="662" height="60" rx="14" fill="#ffffff" stroke="#dfe1ee" stroke-width="2"/>
  <text x="84" y="200" fill="#141522" font-family="sans-serif" font-size="13" font-weight="700">Пропуск обнуляет только текущую серию</text>
  <text x="84" y="220" fill="#5b6072" font-family="sans-serif" font-size="12">Пройденные уроки и прогресс по курсу остаются на месте — навсегда.</text>
