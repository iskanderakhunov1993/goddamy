<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Сравнение: один большой релиз с единственным отзывом в конце и четыре итерации с отзывом после каждой">
  <defs>
    <marker id="it-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4b3aeb"/>
    </marker>
    <marker id="it-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>

  <text x="24" y="36" font-size="18" font-weight="700" fill="#12141d">Одно приложение такси, два способа его выпустить</text>

  <text x="24" y="74" font-size="13" font-weight="700" fill="#5b6072">Один большой релиз</text>
  <rect x="24" y="86" width="596" height="50" rx="11" fill="#f5f6fb" stroke="#dfe1ee"/>
  <text x="322" y="116" font-size="13" fill="#12141d" text-anchor="middle">Год разработки без проверки на пользователях</text>
  <line x1="624" y1="111" x2="652" y2="111" stroke="#b3261e" stroke-width="2" marker-end="url(#it-arrow-red)"/>
  <rect x="658" y="96" width="118" height="30" rx="15" fill="#fdecea"/>
  <text x="717" y="116" font-size="13" font-weight="700" fill="#b3261e" text-anchor="middle">Первый отзыв</text>

  <text x="24" y="182" font-size="13" font-weight="700" fill="#5b6072">Те же функции по шагам</text>

  <g fill="none" stroke="#4b3aeb" stroke-width="2" marker-end="url(#it-arrow)">
    <line x1="186" y1="232" x2="216" y2="232"/>
    <line x1="384" y1="232" x2="414" y2="232"/>
    <line x1="582" y1="232" x2="612" y2="232"/>
  </g>

  <g>
    <rect x="24" y="194" width="158" height="76" rx="11" fill="#e9e6ff" stroke="#4b3aeb"/>
    <text x="38" y="218" font-size="12" font-weight="700" fill="#4b3aeb">Шаг 1</text>
    <text x="38" y="238" font-size="13" font-weight="700" fill="#12141d">Заказ машины</text>
    <rect x="38" y="246" width="74" height="18" rx="9" fill="#e3f4ea"/>
    <text x="75" y="259" font-size="12" fill="#1b7a4b" text-anchor="middle">работает</text>

    <rect x="222" y="194" width="158" height="76" rx="11" fill="#e9e6ff" stroke="#4b3aeb"/>
    <text x="236" y="218" font-size="12" font-weight="700" fill="#4b3aeb">Шаг 2</text>
    <text x="236" y="238" font-size="13" font-weight="700" fill="#12141d">Оплата картой</text>
    <rect x="236" y="246" width="74" height="18" rx="9" fill="#e3f4ea"/>
    <text x="273" y="259" font-size="12" fill="#1b7a4b" text-anchor="middle">работает</text>

    <rect x="420" y="194" width="158" height="76" rx="11" fill="#e9e6ff" stroke="#4b3aeb"/>
    <text x="434" y="218" font-size="12" font-weight="700" fill="#4b3aeb">Шаг 3</text>
    <text x="434" y="238" font-size="13" font-weight="700" fill="#12141d">Цена до аэропорта</text>
    <rect x="434" y="246" width="74" height="18" rx="9" fill="#e3f4ea"/>
    <text x="471" y="259" font-size="12" fill="#1b7a4b" text-anchor="middle">работает</text>

    <rect x="618" y="194" width="158" height="76" rx="11" fill="#ffffff" stroke="#4b3aeb" stroke-dasharray="5 4"/>
    <text x="632" y="218" font-size="12" font-weight="700" fill="#4b3aeb">Шаг 4</text>
    <text x="632" y="238" font-size="13" font-weight="700" fill="#12141d">Решим по отзывам</text>
    <text x="632" y="259" font-size="12" fill="#5b6072">пока не начат</text>
  </g>

  <g font-size="12">
    <text x="24" y="294" font-weight="700" fill="#4b3aeb">Отзыв после шага</text>
    <text x="24" y="312" fill="#12141d">Неудобно без карты</text>
    <text x="222" y="294" font-weight="700" fill="#4b3aeb">Отзыв после шага</text>
    <text x="222" y="312" fill="#12141d">Часто едут в аэропорт</text>
    <text x="420" y="294" font-weight="700" fill="#4b3aeb">Отзыв после шага</text>
    <text x="420" y="312" fill="#12141d">Собираем сейчас</text>
  </g>

  <rect x="24" y="340" width="752" height="40" rx="12" fill="#f5f6fb" stroke="#dfe1ee"/>
  <text x="400" y="365" font-size="13" fill="#12141d" text-anchor="middle">Большой релиз: одна проверка за год. Итерации: проверка после каждого шага.</text>
</svg>
