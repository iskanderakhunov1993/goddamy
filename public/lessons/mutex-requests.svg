<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b3aeb"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b3261e"/></marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="20" y="20" width="370" height="320" rx="14" fill="#f5f6fb" stroke="#dfe1ee"/>
    <text x="40" y="52" font-size="12" font-weight="700" fill="#b3261e" letter-spacing="1">БЕЗ ЗАМКА</text>
    <rect x="40" y="76" width="130" height="50" rx="10" fill="#ffffff" stroke="#dfe1ee"/>
    <text x="105" y="106" font-size="14" fill="#12141d" text-anchor="middle">Запрос А</text>
    <rect x="40" y="150" width="130" height="50" rx="10" fill="#ffffff" stroke="#dfe1ee"/>
    <text x="105" y="180" font-size="14" fill="#12141d" text-anchor="middle">Запрос Б</text>
    <rect x="240" y="96" width="130" height="84" rx="10" fill="#fdecea" stroke="#f3c5c0"/>
    <text x="305" y="128" font-size="12" fill="#5b6072" text-anchor="middle">счётчик</text>
    <text x="305" y="158" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#12141d" text-anchor="middle">5</text>
    <line x1="170" y1="101" x2="234" y2="124" stroke="#b3261e" stroke-width="2.5" marker-end="url(#r)"/>
    <line x1="170" y1="175" x2="234" y2="152" stroke="#b3261e" stroke-width="2.5" marker-end="url(#r)"/>
    <text x="40" y="238" font-size="13" fill="#12141d">Оба прочитали 5, оба записали 6.</text>
    <text x="40" y="260" font-size="13" fill="#12141d">Одно увеличение потерялось.</text>
    <rect x="40" y="280" width="330" height="40" rx="10" fill="#fdecea"/>
    <text x="205" y="305" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#b3261e" text-anchor="middle">итог: 6, а должно быть 7</text>

    <rect x="410" y="20" width="370" height="320" rx="14" fill="#f5f6fb" stroke="#dfe1ee"/>
    <text x="430" y="52" font-size="12" font-weight="700" fill="#1b7a4b" letter-spacing="1">С МЬЮТЕКСОМ</text>
    <rect x="430" y="76" width="130" height="50" rx="10" fill="#ffffff" stroke="#dfe1ee"/>
    <text x="495" y="106" font-size="14" fill="#12141d" text-anchor="middle">Запрос А</text>
    <rect x="430" y="150" width="130" height="50" rx="10" fill="#fff3d6" stroke="#f0d9a0"/>
    <text x="495" y="173" font-size="14" fill="#12141d" text-anchor="middle">Запрос Б</text>
    <text x="495" y="191" font-size="12" fill="#b26a00" text-anchor="middle">ждёт Unlock</text>
    <rect x="630" y="96" width="130" height="84" rx="10" fill="#e3f4ea" stroke="#b9e0c8"/>
    <text x="695" y="128" font-size="12" fill="#5b6072" text-anchor="middle">счётчик</text>
    <text x="695" y="158" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#12141d" text-anchor="middle">5</text>
    <line x1="560" y1="101" x2="624" y2="116" stroke="#4b3aeb" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="560" y1="175" x2="594" y2="164" stroke="#b26a00" stroke-width="2.5" stroke-dasharray="5 4"/>
    <rect x="598" y="146" width="20" height="24" rx="5" fill="#4b3aeb"/>
    <text x="430" y="238" font-size="13" fill="#12141d">А закрыл замок, записал 6 и открыл.</text>
    <text x="430" y="260" font-size="13" fill="#12141d">Б прочитал уже 6 и записал 7.</text>
    <rect x="430" y="280" width="330" height="40" rx="10" fill="#e3f4ea"/>
    <text x="595" y="305" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1b7a4b" text-anchor="middle">итог: 7</text>
  </g>
