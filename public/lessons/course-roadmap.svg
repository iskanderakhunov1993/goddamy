<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="560" fill="#0a0a23"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b5cff"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">

    <!-- cascading connectors, waterfall style -->
    <line x1="80" y1="100" x2="140" y2="140" stroke="#6b5cff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="180" y1="180" x2="240" y2="220" stroke="#6b5cff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="280" y1="260" x2="340" y2="300" stroke="#6b5cff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="380" y1="340" x2="440" y2="380" stroke="#6b5cff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="480" y1="420" x2="540" y2="460" stroke="#6b5cff" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Step 1 · Старт (current) -->
    <rect x="20" y="20" width="300" height="80" rx="12" fill="#1c1a4a" stroke="#ffd300" stroke-width="2.5"/>
    <circle cx="54" cy="52" r="16" fill="#ffd300"/>
    <text x="54" y="58" fill="#0a0a23" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="84" y="50" fill="#ffffff" font-size="16" font-weight="700">Старт</text>
    <text x="84" y="72" fill="#ffd300" font-size="12">ты здесь</text>

    <!-- Step 2 · База Go -->
    <rect x="120" y="100" width="300" height="80" rx="12" fill="#14143a" stroke="#3a3f5c" stroke-width="1.5"/>
    <circle cx="154" cy="132" r="16" fill="#4b3aeb"/>
    <text x="154" y="138" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="184" y="130" fill="#ffffff" font-size="16" font-weight="700">База Go</text>
    <text x="184" y="152" fill="#9aa0c3" font-size="12">язык + тесты</text>

    <!-- Step 3 · Task Tracker -->
    <rect x="220" y="180" width="300" height="80" rx="12" fill="#14143a" stroke="#3a3f5c" stroke-width="1.5"/>
    <circle cx="254" cy="212" r="16" fill="#4b3aeb"/>
    <text x="254" y="218" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="284" y="210" fill="#ffffff" font-size="16" font-weight="700">Проект 1 · Task Tracker</text>
    <text x="284" y="232" fill="#9aa0c3" font-size="12">CLI, JSON, тесты</text>

    <!-- Step 4 · Expense Tracker -->
    <rect x="320" y="260" width="300" height="80" rx="12" fill="#14143a" stroke="#3a3f5c" stroke-width="1.5"/>
    <circle cx="354" cy="292" r="16" fill="#4b3aeb"/>
    <text x="354" y="298" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="384" y="290" fill="#ffffff" font-size="16" font-weight="700">Проект 2 · Expense Tracker</text>
    <text x="384" y="312" fill="#9aa0c3" font-size="12">PostgreSQL, HTTP API</text>

    <!-- Step 5 · URL Shortener -->
    <rect x="420" y="340" width="300" height="80" rx="12" fill="#14143a" stroke="#3a3f5c" stroke-width="1.5"/>
    <circle cx="454" cy="372" r="16" fill="#4b3aeb"/>
    <text x="454" y="378" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">5</text>
    <text x="484" y="370" fill="#ffffff" font-size="16" font-weight="700">Проект 3 · URL Shortener</text>
    <text x="484" y="392" fill="#9aa0c3" font-size="12">Docker, CI, релиз</text>

    <!-- Step 6 · Портфолио -->
    <rect x="520" y="420" width="300" height="80" rx="12" fill="#14143a" stroke="#3a3f5c" stroke-width="1.5"/>
    <circle cx="554" cy="452" r="16" fill="#4b3aeb"/>
    <text x="554" y="458" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">6</text>
    <text x="584" y="450" fill="#ffffff" font-size="16" font-weight="700">Портфолио + сертификат</text>
    <text x="584" y="472" fill="#9aa0c3" font-size="12">три проекта на GitHub</text>

    <text x="450" y="535" fill="#6b6f94" font-size="13" text-anchor="middle">Каждый модуль опирается на то, что собрано в предыдущем — маршрут на полтора месяца.</text>
  </g>
</svg>
