<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="34" font-size="12" font-weight="700" fill="#5b6072" letter-spacing="1">ОБЩАЯ БАЗА</text>
    <rect x="24" y="48" width="240" height="78" rx="12" fill="#e9e6ff" stroke="#4b3aeb" stroke-width="2"/>
    <circle cx="52" cy="78" r="14" fill="#4b3aeb"/><text x="52" y="83" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="76" y="76" font-size="15" font-weight="700" fill="#12141d">Модуль 1 · Старт</text>
    <text x="76" y="96" font-size="12" fill="#4b3aeb" font-weight="700">ты здесь</text>
    <text x="76" y="113" font-size="12" fill="#5b6072">курс и инструменты</text>

    <rect x="280" y="48" width="240" height="78" rx="12" fill="#f5f6fb" stroke="#dfe1ee"/>
    <circle cx="308" cy="78" r="14" fill="#4b3aeb"/><text x="308" y="83" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="332" y="76" font-size="15" font-weight="700" fill="#12141d">Модуль 2 · Команды</text>
    <text x="332" y="98" font-size="12" fill="#5b6072">продукт, Kanban, Scrum</text>

    <rect x="536" y="48" width="240" height="78" rx="12" fill="#f5f6fb" stroke="#dfe1ee"/>
    <circle cx="564" cy="78" r="14" fill="#4b3aeb"/><text x="564" y="83" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
