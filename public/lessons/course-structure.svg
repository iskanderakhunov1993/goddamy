<svg width="800" height="460" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="460" fill="#eef1fb"/>

  <!-- left: module -->
  <text x="40" y="60" fill="#5b6072" font-family="monospace" font-size="12" font-weight="700">МОДУЛЬ</text>
  <rect x="30" y="80" width="150" height="300" rx="16" fill="#f1f2f7" stroke="#dfe1ee" stroke-width="2"/>
  <text x="50" y="115" fill="#141522" font-family="sans-serif" font-size="14" font-weight="700">Тема 1</text>
  <text x="50" y="140" fill="#141522" font-family="sans-serif" font-size="14" font-weight="700">Тема 2</text>
  <rect x="42" y="150" width="126" height="60" rx="10" fill="#ffffff" stroke="#4b3aeb" stroke-width="2"/>
  <text x="56" y="172" fill="#4b3aeb" font-family="sans-serif" font-size="12" font-weight="700">сейчас здесь</text>
  <text x="56" y="192" fill="#5b6072" font-family="sans-serif" font-size="11">5 уроков</text>
  <text x="50" y="240" fill="#8f92aa" font-family="sans-serif" font-size="14">Тема 3</text>
  <text x="50" y="265" fill="#8f92aa" font-family="sans-serif" font-size="14">Тема 4</text>

  <path d="M188 230 L 232 230" stroke="#4b3aeb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M224 223 l8 7 l-8 7" stroke="#4b3aeb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- middle: one lesson (theory + trainer) -->
  <text x="248" y="60" fill="#5b6072" font-family="monospace" font-size="12" font-weight="700">ОДИН УРОК</text>
  <rect x="248" y="80" width="220" height="300" rx="16" fill="#ffffff" stroke="#dfe1ee" stroke-width="2"/>
  <circle cx="278" cy="115" r="12" fill="#4b3aeb"/>
  <text x="272" y="120" fill="#fff" font-family="monospace" font-size="12" font-weight="700">1</text>
  <text x="300" y="120" fill="#141522" font-family="sans-serif" font-size="13" font-weight="700">Теория</text>
  <rect x="272" y="136" width="172" height="8" rx="4" fill="#dfe1ee"/>
  <rect x="272" y="150" width="140" height="8" rx="4" fill="#dfe1ee"/>

  <circle cx="278" cy="200" r="12" fill="#ffd300"/>
  <text x="273" y="205" fill="#141522" font-family="monospace" font-size="12" font-weight="700">2</text>
  <text x="300" y="205" fill="#141522" font-family="sans-serif" font-size="13" font-weight="700">Запусти код сам</text>
  <rect x="272" y="220" width="172" height="46" rx="8" fill="#0a0a23"/>
  <text x="284" y="240" fill="#ffd300" font-family="monospace" font-size="11">go run main.go</text>
  <text x="284" y="256" fill="#5ec8d8" font-family="monospace" font-size="11">✓ passed</text>

  <circle cx="278" cy="300" r="12" fill="#4b3aeb"/>
  <text x="273" y="305" fill="#fff" font-family="monospace" font-size="12" font-weight="700">3</text>
  <text x="300" y="305" fill="#141522" font-family="sans-serif" font-size="13" font-weight="700">Мини-квиз</text>
  <rect x="272" y="320" width="172" height="30" rx="8" fill="#dcfce7"/>
  <text x="284" y="339" fill="#166534" font-family="sans-serif" font-size="11">Ответ верный ✓</text>

  <path d="M478 230 L 522 230" stroke="#4b3aeb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M514 223 l8 7 l-8 7" stroke="#4b3aeb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right: module project -->
  <text x="538" y="60" fill="#5b6072" font-family="monospace" font-size="12" font-weight="700">ПРОЕКТ МОДУЛЯ</text>
  <rect x="538" y="80" width="230" height="300" rx="16" fill="#0a0a23"/>
  <rect x="562" y="110" width="182" height="130" rx="10" fill="#181933" stroke="#3a3f5c" stroke-width="1.5"/>
  <text x="578" y="136" fill="#ffd300" font-family="monospace" font-size="12">$ go build</text>
  <text x="578" y="158" fill="#c7c9d6" font-family="monospace" font-size="12">$ go test ./...</text>
  <text x="578" y="180" fill="#5ec8d8" font-family="monospace" font-size="12">PASS  ok  0.4s</text>
  <text x="578" y="210" fill="#8f92aa" font-family="monospace" font-size="11">$ git push origin</text>
  <text x="562" y="270" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Task Tracker CLI</text>
  <text x="562" y="292" fill="#9296b8" font-family="sans-serif" font-size="11">публичный репозиторий</text>
  <circle cx="620" cy="335" r="16" fill="#ffd300"/>
  <path d="M611 335 l6 6 l12 -14" stroke="#0a0a23" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M320 400 C 320 430, 480 430, 480 400" stroke="#8f92aa" stroke-width="2.5" fill="none" stroke-dasharray="5 7" stroke-linecap="round"/>
  <text x="330" y="450" fill="#5b6072" font-family="sans-serif" font-size="12">и так до конца темы, потом — следующая тема</text>
</svg>
